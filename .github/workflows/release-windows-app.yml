name: Release Windows app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:ELECTRON_EXECUTABLE = (Resolve-Path "release/win-unpacked/VECTRA Sensor Monitor.exe").Path
          npm run test:desktop

      - name: Publish GitHub Release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content "windows-app/package.json" | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "windows-app/release/VECTRA Sensor Monitor-Setup-$version-x64.exe" `
            "windows-app/release/VECTRA Sensor Monitor-Portable-$version-x64.exe" `
            --title "VECTRA Sensor Monitor $version" `
            --notes "Windows x64 release. A single-viewport motor monitoring workspace keeps all three plots, nine vibration values, numerical temperature and frequency visible at tested desktop/tablet sizes. Compact telemetry rail, portrait reflow, overlay registry, context toggle and quick time ranges improve use of space. Axis hover/keyboard focus emphasizes matching traces; native raw/formula popovers avoid clipping and close before fullscreen. The reference 3D model is exclusively on its own lazily loaded tab, outside the dashboard. Window startup respects the display work area. Physical frequency order and RMS/Peak semantics still require confirmation."
