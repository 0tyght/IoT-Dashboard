name: Release Windows app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:ELECTRON_EXECUTABLE = (Resolve-Path "release/win-unpacked/VECTRA Sensor Monitor.exe").Path
          npm run test:desktop

      - name: Publish GitHub Release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content "windows-app/package.json" | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "windows-app/release/VECTRA Sensor Monitor-Setup-$version-x64.exe" `
            "windows-app/release/VECTRA Sensor Monitor-Portable-$version-x64.exe" `
            --title "VECTRA Sensor Monitor $version" `
            --notes "Windows x64 release. One Start command verifies sensors, starts acquisition and records automatically; one Stop disconnects and waits for pending file writes. Legacy manual-start settings follow the new combined Start action. Explicit monitor-only and scheduled recording remain available from Mode; More contains recording-only stop, immediate recording start, data folder and simulation. Recording duration stops recording while monitoring continues, with an explicit status. Daily CSV and NDJSON include UTC/Bangkok timestamps, all nine vibration channels and temperature. All measurement plots are shown together with linked time cursors. Scheduled recording requires the app to remain open and acquisition to be running. Sensor refresh rate and RMS/Peak semantics still require hardware/vendor confirmation."
