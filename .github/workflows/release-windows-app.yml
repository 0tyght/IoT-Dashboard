name: Release Windows app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:ELECTRON_EXECUTABLE = (Resolve-Path "release/win-unpacked/VECTRA Sensor Monitor.exe").Path
          npm run test:desktop

      - name: Publish GitHub Release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content "windows-app/package.json" | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "windows-app/release/VECTRA Sensor Monitor-Setup-$version-x64.exe" `
            "windows-app/release/VECTRA Sensor Monitor-Portable-$version-x64.exe" `
            --title "VECTRA Sensor Monitor $version" `
            --notes "Windows x64 release. Consolidates historical graphs and waveform FFT in one Analysis workspace with clearly separated data sources. Saved overall readings open as an XYZ 3D scatter with actual units, timestamps, fullscreen and keyboard controls; time-trend plots remain available. Large scatter datasets use deterministic uniform record sampling after run/schema filters, with complete/incomplete counts. History is now a records/export page with shared motor/run/date selections. The motor registry becomes an accessible drawer on every narrow page. Filter changes and read errors clear stale data. FFT still requires waveform samples. Numerical, storage and packaged desktop suites verify the release across desktop and tablet viewport sizes."
