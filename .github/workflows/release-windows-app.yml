name: Release Windows app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:ELECTRON_EXECUTABLE = (Resolve-Path "release/win-unpacked/VECTRA Sensor Monitor.exe").Path
          npm run test:desktop

      - name: Publish GitHub Release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content "windows-app/package.json" | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "windows-app/release/VECTRA Sensor Monitor-Setup-$version-x64.exe" `
            "windows-app/release/VECTRA Sensor Monitor-Portable-$version-x64.exe" `
            --title "VECTRA Sensor Monitor $version" `
            --notes "Windows x64 release. Fixes saved-history restoration by filtering the sensor identity before reducing points. Archived motor IDs remain selectable, and recordings with different units or decoding settings use separate chart series. Original acquisition gaps and missing-channel boundaries are preserved. The historical 3D view now uses actual timestamps and projected point selection, with keyboard controls, zoom, reset and fullscreen. Unit tests and both packaged desktop regression suites verify the release."
