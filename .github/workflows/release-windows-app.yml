name: Release Windows app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Build installer and portable app
        run: npm run dist:win

      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:ELECTRON_EXECUTABLE = (Resolve-Path "release/win-unpacked/VECTRA Sensor Monitor.exe").Path
          npm run test:desktop

      - name: Publish GitHub Release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content "windows-app/package.json" | ConvertFrom-Json).version
          gh release create "${{ github.ref_name }}" `
            "windows-app/release/VECTRA Sensor Monitor-Setup-$version-x64.exe" `
            "windows-app/release/VECTRA Sensor Monitor-Portable-$version-x64.exe" `
            --title "VECTRA Sensor Monitor $version" `
            --notes "Windows x64 release. Three full-width vibration plots with linked cursors; temperature and frequency X/Y/Z are numerical. Includes the user's offline V4 reference model with camera controls, fullscreen and static fallback. Frequency raw words are read separately; Hz requires an explicitly confirmed Float32 byte/word order. Frequency failures preserve primary vibration measurements. CSV v3 adds frequency and quality fields; existing v2 files remain unchanged. One Start verifies sensors, acquires and records; one Stop disconnects and drains file writes. Physical sensor refresh rate, Float order, RMS/Peak semantics and sensor position still require commissioning."
